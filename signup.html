<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NairaPulse - Sign Up</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="signup-page">

        <!-- LOGO -->
        <div class="brand">
            <div class="brand-logo">

                <svg viewBox="0 0 64 64">

                    <path
                        d="M10 20L32 8L54 20L32 32L10 20Z"
                        stroke="#00e676"
                        stroke-width="3.5"
                        fill="none"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M10 30L32 42L54 30"
                        stroke="#00e676"
                        stroke-width="3.5"
                        fill="none"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M10 40L32 52L54 40"
                        stroke="#00e676"
                        stroke-width="3.5"
                        fill="none"
                        stroke-linejoin="round"
                    />

                </svg>

            </div>

            <h1>NairaPulse</h1>
        </div>


        <!-- SIGNUP CARD -->
        <div class="signup-card">

            <div class="signup-heading">

                <h2>Create Your Account</h2>

                <p>
                    Sign up for free and start managing your money.
                </p>

            </div>


            <form id="signupForm">

                <!-- NAME -->
                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- TERMS -->
                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the terms and conditions.
                    </span>

                </label>


                <!-- MESSAGE -->
                <p
                    id="signupMessage"
                    class="signup-message">
                </p>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="signup-btn">

                    Sign Up Free

                </button>

            </form>


            <!-- LOGIN -->
            <div class="login-link">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script src="signup.js"></script>

</body>

</html>
